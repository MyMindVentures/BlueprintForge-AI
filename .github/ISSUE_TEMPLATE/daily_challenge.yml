name: Daily Challenge
about: Post a daily 07:30 builder challenge
labels: [daily-challenge, builder-wanted]
title: "[Daily Challenge] "
body:
  - type: markdown
    attributes:
      value: |
        Use this template for the daily BlueprintForge AI improvement challenge.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this improvement matter?
      placeholder: Explain the product reason behind this challenge.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should builders create or improve?
      placeholder: Describe the desired outcome.
    validations:
      required: true
  - type: textarea
    id: user_story
    attributes:
      label: User Story
      placeholder: As a [role], I want [feature], so that [benefit].
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      placeholder: |
        - Requirement 1
        - Requirement 2
        - Requirement 3
    validations:
      required: true
  - type: textarea
    id: uiux
    attributes:
      label: Suggested UI / UX
      placeholder: Layout, widgets, mobile behavior, design direction.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
        - [ ] Criteria 3
    validations:
      required: true
  - type: textarea
    id: builder_notes
    attributes:
      label: Builder Notes
      placeholder: Extra notes for contributors.